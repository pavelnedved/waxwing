<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="ww-svg sequence-svg" data-skin="standard" data-theme="light" width="1032" height="666" viewBox="0 0 1032 666" role="group" aria-labelledby="ww-title ww-description"><title id="ww-title">Checkout times out before payment succeeds</title><desc id="ww-description">One partial scenario. Top to bottom follows the established order claim. Spacing does not represent duration. Messages do not imply blocking.</desc>
<metadata id="waxwing-source" data-encoding="base64"></metadata>
<style>.ww-svg { --canvas:#f6f7f9; --surface:#fff; --ink:#17283a; --muted:#5f7183; --line:#7e91a2; --border:#d2dce5; --frame:#edf1f5; --accent:#087d78; --warning:#9c630d; background:var(--canvas); color:var(--ink); font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
.ww-svg[data-theme="dark"] { --canvas:#101a25; --surface:#182737; --ink:#e6eef5; --muted:#a0b2c4; --line:#7f9ab1; --border:#34495e; --frame:#142230; --accent:#5dd6c4; --warning:#f1c778; }
.ww-svg .frame { fill:var(--frame); stroke:var(--border); stroke-width:1.5; stroke-dasharray:5 5; }
.ww-svg text { fill:var(--ink); }
.ww-svg .frame-title { font-size:14px; font-weight:600; letter-spacing:.2px; }
.ww-svg .node-box { fill:var(--surface); stroke:var(--border); stroke-width:1.5; }
.ww-svg .node-title { font-size:15px; font-weight:650; }
.ww-svg .node-category { font-size:11px; text-transform:uppercase; fill:var(--muted); letter-spacing:1px; }
.ww-svg .node-status { font-size:10px; fill:var(--muted); }
.ww-svg .node-alert { font-size:11px; fill:var(--warning); }
.ww-svg .node-link { font-size:11px; fill:var(--muted); }
.ww-svg .accent { fill:var(--accent); }
.ww-svg .category-datastore .accent { fill:#8970c1; }
.ww-svg .category-queue .accent { fill:#ce9748; }
.ww-svg .edge-line { fill:none; stroke:var(--line); stroke-width:1.6; }
.ww-svg .edge-hit { fill:none; stroke:transparent; stroke-width:16; }
.ww-svg .qualified .edge-line { stroke-dasharray:5 5; }
.ww-svg .edge-label-bg { fill:var(--canvas); }
.ww-svg .edge-label { font-size:12px; }
.ww-svg .edge-note { fill:var(--warning); }
.ww-svg .arrow { fill:var(--line); }
.ww-svg .record { cursor:pointer; outline:none; }
.ww-svg .record:hover .node-box, .ww-svg .record:focus .node-box, .ww-svg .record.selected .node-box { stroke:var(--accent); stroke-width:2.5; }
.ww-svg .record:hover .edge-line, .ww-svg .record:focus .edge-line, .ww-svg .record.selected .edge-line { stroke:var(--accent); stroke-width:2.5; }
.ww-svg .record:focus .frame, .ww-svg .record.selected .frame { stroke:var(--accent); stroke-width:2.5; }

/* Skins share all text metrics and geometry. Category and qualification cues remain. */
.ww-svg[data-skin="engineering"] { --canvas:#f0f6fa; --surface:#fff; --ink:#102e48; --muted:#526d83; --line:#55748b; --border:#bbcdda; --frame:#e5eff6; --accent:#155f9b; }
.ww-svg[data-skin="engineering"][data-theme="dark"] { --canvas:#0e1c2a; --surface:#162b3d; --ink:#e1eff9; --muted:#a3bed0; --line:#88aabd; --border:#39566c; --frame:#122535; --accent:#7cc9fc; }
.ww-svg[data-skin="engineering"] .node-box { rx:3px; }
.ww-svg[data-skin="editorial"] { --canvas:#f5f0e7; --surface:#fffdf8; --ink:#302e29; --muted:#71695c; --line:#92816c; --border:#d4c8b7; --frame:#ece4d8; --accent:#87533b; }
.ww-svg[data-skin="editorial"][data-theme="dark"] { --canvas:#201d19; --surface:#2e2923; --ink:#f2e9dd; --muted:#c5b6a0; --line:#b9a386; --border:#5e5141; --frame:#28231e; --accent:#efb38d; }
.ww-svg .record.highlight-match .node-box, .ww-svg .record.highlight-match .frame { stroke:var(--accent); stroke-width:3.5; }
.ww-svg .record.highlight-match .edge-line { stroke:var(--accent); stroke-width:3.5; }
.ww-svg .record.highlight-match .edge-label-bg { stroke:var(--accent); stroke-width:1; }

.sequence-svg .lifeline { stroke:var(--border); stroke-width:1.2; stroke-dasharray:4 6; }
.sequence-svg .sequence-caption { font-size:12px; fill:var(--muted); }
.sequence-svg .reply .edge-line { stroke-dasharray:8 4; }
.sequence-svg .uncertain .edge-line { stroke:var(--warning); }
.sequence-svg .uncertain .edge-label { fill:var(--warning); }
.sequence-svg .record.selected .edge-label-bg { stroke:var(--accent); stroke-width:1; }
</style><defs><marker id="ww-sequence-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
