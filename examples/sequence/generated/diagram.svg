<path class="edge-hit" d="M516,308 L856,308"/><path class="edge-line" d="M516,308 L856,308" marker-end="url(#ww-sequence-arrow)"/><rect class="edge-label-bg" x="575.2" y="270" width="221.6" height="30" rx="4"/><text class="edge-label" x="585.2" y="288">2. message · Request payment</text></g></g><g class="record" data-ref="timeout" tabindex="0" role="button" aria-label="Inspect Order request times out locally"><g class="sequence-step event"><path class="edge-hit" d="M176,400 L476.8,400 L476.8,424 L176,424"/><path class="edge-line" d="M176,400 L476.8,400 L476.8,424 L176,424" marker-end="url(#ww-sequence-arrow)"/><rect class="edge-label-bg" x="194" y="344" width="264.8" height="48" rx="4"/><text class="edge-label" x="204" y="362">3. event · Order request times out</text><text class="edge-label" x="204" y="380">locally</text></g></g><g class="record" data-ref="paid" tabindex="0" role="button" aria-label="Inspect Payment succeeds"><g class="sequence-step reply"><path class="edge-hit" d="M856,498 L516,498"/><path class="edge-line" d="M856,498 L516,498" marker-end="url(#ww-sequence-arrow)"/><rect class="edge-label-bg" x="578.8" y="460" width="214.4" height="30" rx="4"/><text class="edge-label" x="588.8" y="478">4. reply · Payment succeeds</text></g></g><g class="record" data-ref="retry" tabindex="0" role="button" aria-label="Inspect Retry the same order request"><g class="sequence-step message"><path class="edge-hit" d="M176,590 L516,590"/><path class="edge-line" d="M176,590 L516,590" marker-end="url(#ww-sequence-arrow)"/><rect class="edge-label-bg" x="217.2" y="534" width="257.6" height="48" rx="4"/><text class="edge-label" x="227.2" y="552">5. message · Retry the same order</text><text class="edge-label" x="227.2" y="570">request</text></g></g></svg>
