name: Bug report
description: Report a reproducible Waxwing problem
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Waxwing version or commit, Node version, OS, and browser if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command and a minimal model. Remove sensitive information; exported artifacts include their source model and documents.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include diagnostics or a screenshot when useful.
    validations:
      required: true
